name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # manual trigger also possible

jobs:
  ai-review:
    runs-on: self-hosted   #

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v3

      - name: Detect Changed Python Files
        id: detect
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # Fetch the base branch from origin
          git fetch origin $env:BASE_REF

          # Get changed python files between base and HEAD
          $changed = git diff --name-only origin/$env:BASE_REF -- '*.py'

          Write-Output "Changed files:"
          Write-Output $changed

          # Write changed files to a file
          $changed | Out-File -Encoding utf8 changed_files.txt

          # Set output variable 'files' for next steps
          Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $changed
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"


      - name: Run AI Review on Changed Files
        id: review
        shell: bash
        run: |
          mkdir -p ai_reviews

          while IFS= read -r FILE
          do
            if [ -f "$FILE" ]; then
              
              # Escape double-quotes so JSON is valid
              CONTENT=$(sed 's/"/\\"/g' "$FILE")

              PAYLOAD="{\"code\":\"$CONTENT\",\"file_path\":\"$FILE\",\"language\":\"python\"}"

              echo "🔍 Sending $FILE to AI agent..."

              RESPONSE=$(curl -s -X POST http://localhost:8000/api/review/code \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")

              # Save response
              OUTFILE="ai_reviews/$(basename $FILE).json"
              echo "$RESPONSE" > "$OUTFILE"

              echo "✅ AI Review for $FILE saved to $OUTFILE"
            fi
          done < changed_files.txt

      - name: Combine AI Results
        id: combine
        shell: bash
        run: |
          echo "### 🤖 AI Code Review Results" > feedback.md
          for f in ai_reviews/*.json; do
            echo "\n**File: $(basename $f)**" >> feedback.md
            cat $f >> feedback.md
            echo "\n---" >> feedback.md
          done
          echo "done=true" >> $GITHUB_OUTPUT

      - name: Post AI Review as PR Comment
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            $(cat feedback.md)
