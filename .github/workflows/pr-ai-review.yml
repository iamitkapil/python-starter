name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  ai-review:
    runs-on: self-hosted

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Detect Changed Python Files
        id: detect
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin $env:BASE
          $changed = git diff --name-only origin/$env:BASE -- '*.py'
          $changed | Out-File changed_files.txt -Encoding utf8

      - name: Run AI Review on Changed Files
        id: review
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ai_reviews | Out-Null
          foreach ($file in Get-Content changed_files.txt) {
            $trim = $file.Trim()
            if (-not (Test-Path $trim)) { continue }
            $content = Get-Content $trim -Raw
            $escaped = $content.Replace("\", "\\")
            $payload = [ordered]@{
              code=$escaped; file_path=$trim; language="python"
            } | ConvertTo-Json -Depth 10

            $response = Invoke-RestMethod -Uri "http://localhost:8000/api/review/code" -Method POST -ContentType "application/json" -Body $payload

            $outfile = "ai_reviews/$([System.IO.Path]::GetFileName($trim)).json"
            $response | ConvertTo-Json -Depth 10 | Out-File $outfile -Encoding utf8
          }

      - name: Enterprise Markdown Report
        id: combine
        shell: pwsh
        run: |

          function Escape-Markdown($text) {
            return $text `
              -replace '\|', '&#124;' `
              -replace '\[', '&#91;' `
              -replace '\]', '&#93;' `
              -replace '\{', '&#123;' `
              -replace '\}', '&#125;' `
              -replace '\*', '&#42;' `
              -replace '\_', '&#95;' `
              -replace '\`', '&#96;' `
              -replace '"', '&quot;' `
              -replace "'", '&#39;'
          }

          $files = Get-ChildItem "ai_reviews" -Filter "*.json"
          if (-not $files) {
            "# 🧠 AI Code Review Results`n_No Python files changed._" | Out-File feedback.md
            exit 0
          }

          $aiCritical = 0
          $staticCritical = 0
          $complexityFails = 0
          $maintFails = 0
          $aiRows = ""
          $staticRows = ""
          $maxComplexity = 10
          $minMaintainability = 60

          foreach ($file in $files) {

            $json = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $filePathTop = $json.data.file_path
            $metrics = $json.data.metrics

            $complexity = $metrics.complexity_metrics.cyclomatic_complexity
            $maint = $metrics.maintainability_metrics.maintainability_index
            $sec = $metrics.security_issues

            if ($complexity -gt $maxComplexity) { $complexityFails++ }
            if ($maint -lt $minMaintainability) { $maintFails++ }

            foreach ($s in $sec) {
              $sev = ($s.severity).ToLower()
              if ($sev -in @("critical","high")) { $staticCritical++ }

              $sevEmoji = switch ($sev) {
                "critical" { "🛑 Critical" }
                "high"     { "🔴 High" }
                "medium"   { "🟡 Medium" }
                "low"      { "🟢 Low" }
              }

              $msg = Escape-Markdown ($s.message)
              $line = $s.line ?? $s.line_number ?? "-"
              $staticRows += "| $filePathTop | $($s.type) | $sevEmoji | $msg | $line |`n"
            }

            $aiIssues = $json.data.issues
            foreach ($issue in $aiIssues) {
              $sev = ($issue.severity).ToLower()
              if ($sev -in @("critical","high")) { $aiCritical++ }

              $sevEmoji = switch ($sev) {
                "critical" { "🛑 Critical" }
                "high"     { "🔴 High" }
                "medium"   { "🟡 Medium" }
                "low"      { "🟢 Low" }
              }

              $msg = Escape-Markdown ($issue.message)
              $category = Escape-Markdown ($issue.category)
              $issueFile = Escape-Markdown ($issue.file_path)
              $line = $issue.line_number ?? "-"

              $aiRows += "| $issueFile | $category | $sevEmoji | $msg | $line |`n"
            }

          }  # <-- THIS was missing (IMPORTANT FIX)

          # BUILD MARKDOWN
          $md = @()
          $md += "# 🧠 AI Code Review Results"
          $md += ""
          $md += "## 🤖 AI-Detected Issues"
          $md += "| File | Category | Severity | Message | Line |"
          $md += "|------|----------|----------|---------|------|"
          $md += $aiRows.TrimEnd()
          $md += "---"

          if ($staticCritical -gt 0) {
            $md += "## 🛡️ Static Security Issues"
            $md += "| File | Type | Severity | Message | Line |"
            $md += "|------|------|----------|---------|------|"
            $md += $staticRows.TrimEnd()
            $md += "---"
          }

          $md -join "`n" | Out-File feedback.md
