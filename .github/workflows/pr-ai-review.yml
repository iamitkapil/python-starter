name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  ai-review:
    runs-on: self-hosted

    steps:
      # ---------------------------------------
      # CHECKOUT
      # ---------------------------------------
      - name: Checkout PR Code
        uses: actions/checkout@v4

      # ---------------------------------------
      # DETECT CHANGED PYTHON FILES
      # ---------------------------------------
      - name: Detect Changed Python Files
        id: detect
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin $env:BASE

          $changed = git diff --name-only origin/$env:BASE -- '*.py'
          Write-Host "Changed files:`n$changed"

          $changed | Out-File changed_files.txt -Encoding utf8

      # ---------------------------------------
      # RUN AI BACKEND REVIEW
      # ---------------------------------------
      - name: Run AI Review on Changed Files
        id: review
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ai_reviews | Out-Null

          foreach ($file in Get-Content changed_files.txt) {
            $trim = $file.Trim()
            if (-not (Test-Path $trim)) { continue }

            Write-Host "Sending $trim to AI agent..."

            $content = Get-Content $trim -Raw
            $escaped = $content.Replace("\", "\\")

            $payload = [ordered]@{
              code      = $escaped
              file_path = $trim
              language  = "python"
            } | ConvertTo-Json -Depth 10

            $response = Invoke-RestMethod `
              -Uri "http://localhost:8000/api/review/code" `
              -Method POST `
              -ContentType "application/json" `
              -Body $payload

            $outfile = "ai_reviews/$([System.IO.Path]::GetFileName($trim)).json"
            $response | ConvertTo-Json -Depth 10 | Out-File $outfile -Encoding utf8

            Write-Host "Saved: $outfile"
          }

      # ---------------------------------------
      # PREMIUM MARKDOWN REPORTER
      # ---------------------------------------
      - name: Enterprise Markdown Report (Premium UI)
        id: combine
        shell: pwsh
        run: |
          $files = Get-ChildItem "ai_reviews" -Filter "*.json"

          if (-not $files) {
            "# 🧠 AI Code Review Results`n_No Python files changed._" |
              Out-File feedback.md -Encoding utf8
            exit 0
          }

          $aiCritical = 0
          $staticCritical = 0
          $complexityFails = 0
          $maintFails = 0

          $aiRows = ""
          $staticRows = ""

          $maxComplexity = 10
          $minMaintainability = 60

          foreach ($file in $files) {

            $json = Get-Content $file.FullName -Raw | ConvertFrom-Json

            $filePathTop = $json.data.file_path

            # STATIC METRICS
            $metrics = $json.data.metrics
            $complexity = $metrics.complexity_metrics.cyclomatic_complexity
            $maint = $metrics.maintainability_metrics.maintainability_index
            $sec = $metrics.security_issues

            if ($complexity -gt $maxComplexity) { $complexityFails++ }
            if ($maint -lt $minMaintainability) { $maintFails++ }

            # STATIC SECURITY
            foreach ($s in $sec) {

              $sev = ($s.severity).ToLower()

              if ($sev -in @("critical","high")) { $staticCritical++ }

              $sevEmoji = switch ($sev) {
                "critical" { "🛑 Critical" }
                "high"     { "🔴 High" }
                "medium"   { "🟡 Medium" }
                "low"      { "🟢 Low" }
                default    { $sev }
              }

              # MASTER FIX — Escape pipe characters
              $msg = $s.message ?? $s.description ?? "(no description)"
              $msg = ($msg -replace '\|', '&#124;')

              $line = $s.line ?? $s.line_number ?? "-"

              $staticRows += "| $filePathTop | $($s.type) | $sevEmoji | $msg | $line |\n"
            }

            # AI ISSUES
            $aiIssues = $json.data.issues

            foreach ($issue in $aiIssues) {

              $severity = ($issue.severity).ToString().ToLower()

              if ($severity -in @("critical","high")) { $aiCritical++ }

              $sevEmoji = switch ($severity) {
                "critical" { "🛑 Critical" }
                "high"     { "🔴 High" }
                "medium"   { "🟡 Medium" }
                "low"      { "🟢 Low" }
                default    { $severity }
              }

              # FIX: Normalize fields completely
              $issueFile = if ([string]::IsNullOrWhiteSpace($issue.file_path)) { $filePathTop } else { $issue.file_path }
              $category  = if ([string]::IsNullOrWhiteSpace($issue.category))  { "general" }   else { $issue.category }

              # MASTER FIX — escape pipes
              $msg = if ([string]::IsNullOrWhiteSpace($issue.message)) {
                  "(no message)"
              } else {
                  ($issue.message -replace '\|', '&#124;')
              }

              $line = $issue.line_number ?? "-"

              $aiRows += "| $issueFile | $category | $sevEmoji | $msg | $line |\n"
            }
          }

          # ================================
          # PREMIUM UI BUILD
          # ================================
          $md = @()

          # -------------------------------------------
          # HEADER with badges
          # -------------------------------------------
          $md += "# 🧠 AI Code Review Results"
          $md += ""
          $md += "<p>"
          $md += "<img src='https://img.shields.io/badge/Static_Security-$staticCritical-red?style=for-the-badge' />"
          $md += " <img src='https://img.shields.io/badge/AI_Critical-$aiCritical-red?style=for-the-badge' />"
          $md += " <img src='https://img.shields.io/badge/ComplexityFails-$complexityFails-yellow?style=for-the-badge' />"
          $md += " <img src='https://img.shields.io/badge/MaintainabilityFails-$maintFails-orange?style=for-the-badge' />"
          $md += " <img src='https://img.shields.io/badge/Files-$($files.Count)-blue?style=for-the-badge' />"
          $md += "</p>"
          $md += "---"

          # -------------------------------------------
          # SIMPLE SUMMARY FOR NOW
          # -------------------------------------------
          $md += "## 🔍 Summary"
          $md += "- **$staticCritical STATIC security issues**"
          $md += "- **$aiCritical AI-detected high/critical issues**"
          $md += "- **$complexityFails complexity failures**"
          $md += "- **$maintFails low maintainability files**"
          $md += "- **$($files.Count) total files analyzed**"
          $md += "---"

          # -------------------------------------------
          # AI ISSUES - NOW ALL WILL DISPLAY
          # -------------------------------------------
          if ($aiCritical -gt 0) {
            $md += "## 🤖 AI-Detected Critical Issues"
            $md += "| File | Category | Severity | Message | Line |"
            $md += "|------|----------|----------|---------|------|"
            $md += $aiRows.TrimEnd()
            $md += "---"
          }

          # -------------------------------------------
          # STATIC SECURITY - PREMIUM COLLAPSIBLE
          # -------------------------------------------
          if ($staticCritical -gt 0) {
            $md += "## 🛡️ Static Security Issues"
            $md += "| File | Type | Severity | Message | Line |"
            $md += "|------|------|----------|---------|------|"
            $md += $staticRows.TrimEnd()
            $md += "---"
          }

          # -------------------------------------------
          # QUALITY GATES
          # -------------------------------------------
          $md += "## 🚦 Quality Gate Status"
          $md += "| Check | Status | Metric |"
          $md += "|--------|--------|--------|"

          $md += ($aiCritical -gt 0) ?
            "| AI Review | 🔴 FAIL | $aiCritical critical issues |" :
            "| AI Review | 🟢 PASS | 0 critical issues |"

          $md += ($staticCritical -gt 0) ?
            "| Security | 🔴 FAIL | $staticCritical static issues |" :
            "| Security | 🟢 PASS | 0 static issues |"

          $md += ($complexityFails -gt 0) ?
            "| Complexity | 🔴 FAIL | Max allowed: $maxComplexity |" :
            "| Complexity | 🟢 PASS | Within $maxComplexity limit |"

          $md += ($maintFails -gt 0) ?
            "| Maintainability | 🔴 FAIL | Min required: $minMaintainability |" :
            "| Maintainability | 🟢 PASS | Above $minMaintainability |"

          $md -join "`n" | Out-File feedback.md -Encoding utf8

      # ---------------------------------------
      # UPLOAD ARTIFACT
      # ---------------------------------------
      - name: Upload AI Review JSON
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-json
          path: ai_reviews/*.json

      # ---------------------------------------
      # POST PR COMMENT
      # ---------------------------------------
      - name: Post AI Feedback as PR Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('feedback.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' &&
                   c.body.includes("AI Code Review Results")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: content,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: content,
              });
            }

      # ---------------------------------------
      # COMMIT STATUS
      # ---------------------------------------
      - name: Set PR Quality Gate Status
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('feedback.md', 'utf8');

            const failed = content.includes("🔴 FAIL");
            const state = failed ? "failure" : "success";

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: "ai-code-review/quality-gate",
              description: failed ? "Quality Gates Failed" : "Quality Gates Passed"
            });

            if (failed) {
              core.setFailed("Quality Gates Failed ❌");
            }
