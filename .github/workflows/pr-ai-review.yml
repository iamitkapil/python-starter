name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: self-hosted

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Detect Changed Python Files
        id: detect
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # Fetch the base branch from origin
          git fetch origin $env:BASE_REF

          # Get changed python files between base and HEAD
          $changed = git diff --name-only origin/$env:BASE_REF -- '*.py'

          Write-Output "Changed files:"
          Write-Output $changed

          # Write changed files to a file
          $changed | Out-File -Encoding utf8 changed_files.txt

          # Set output variable 'files' for next steps
          Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $changed
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"
          

      - name: Run AI Review on Changed Files
        id: review
        shell: pwsh
        run: |
          # Create output folder
          New-Item -ItemType Directory -Force -Path ai_reviews | Out-Null

          Get-Content changed_files.txt | ForEach-Object {
              $FILE = $_.Trim()
              if (Test-Path $FILE) {

                  Write-Host "Sending $FILE to AI agent..."

                  # Escape quotes for JSON
                  $CONTENT = Get-Content $FILE -Raw

                  # Build JSON payload
                  $PAYLOAD = [ordered]@{
                      code = $CONTENT
                      file_path = $FILE
                      language = 'python'
                  } | ConvertTo-Json -Depth 10

                  # Call AI agent API
                  $RESPONSE = Invoke-RestMethod -Uri "http://localhost:8000/api/review/code" `
                      -Method POST `
                      -ContentType "application/json" `
                      -Body $PAYLOAD

                  # Save response
                  $OUTFILE = "ai_reviews/$([System.IO.Path]::GetFileName($FILE)).json"
                  $RESPONSE | ConvertTo-Json -Depth 10 | Out-File -Encoding utf8 $OUTFILE

                  Write-Host "AI Review for $FILE saved to $OUTFILE"
              }
          }

      # ⭐ NEW ENTERPRISE COMBINE STEP ⭐
      - name: Combine AI Results (Enterprise Markdown Report)
        id: combine
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "ai_reviews" -Filter "*.json" -ErrorAction SilentlyContinue

          if (-not $files -or $files.Count -eq 0) {
            "# 🧠 AI Code Review Results`n_No Python files changed._" | Out-File -Encoding utf8 feedback.md
            return
          }

          $totalFiles = $files.Count
          $securityIssueCount = 0
          $complexityFails = 0
          $maintFails = 0
          $aiCriticalIssues = 0

          $maxComplexity = 10
          $minMaintainability = 60

          $securityTable = ""
          $aiTable = ""

          foreach ($f in $files) {
            $json = Get-Content $f.FullName -Raw | ConvertFrom-Json

            # STATIC METRICS
            $metrics = $json.data.metrics
            $complexity = $metrics.complexity_metrics.cyclomatic_complexity
            $maint = $metrics.maintainability_metrics.maintainability_index
            $secIssues = $metrics.security_issues

            # AI METRICS
            $aiIssues = $json.data.issues
            $optim = $json.data.optimization_suggestions
            $overallScore = $json.data.overall_score

            # COUNT AI critical
            if ($aiIssues) {
              foreach ($ai in $aiIssues) {
                if ($ai.severity -in @("high","critical")) {
                  $aiCriticalIssues++
                  $aiTable += "| $($ai.category) | $($ai.severity) | $($ai.message) | $($ai.line_number) |\n"
                }
              }
            }

            # STATIC SECURITY
            if ($secIssues -and $secIssues.Count -gt 0) {
              $securityIssueCount += 1

              foreach ($issue in $secIssues) {
                $sevEmoji = switch ($issue.severity.ToLower()) {
                  "critical" { "🛑 Critical" }
                  "high"     { "🔴 High" }
                  "medium"   { "🟡 Medium" }
                  "low"      { "🟢 Low" }
                  default    { $issue.severity }
                }

                $securityTable += "| $($issue.type) | $sevEmoji | $($issue.message) | $($issue.line) |\n"
              }
            }

            # FAIL checks
            if ($complexity -gt $maxComplexity)    { $complexityFails++ }
            if ($maint -lt $minMaintainability)    { $maintFails++ }
          }

          # --- SUMMARY ---
          $md = @()
          $md += "# 🧠 AI Code Review Results"
          $md += ""
          $md += "## 🔍 Summary"
          $md += "- **$securityIssueCount files with STATIC security issues**"
          $md += "- **$aiCriticalIssues AI-detected high/critical issues**"
          $md += "- **$complexityFails files failed complexity threshold**"
          $md += "- **$maintFails files with low maintainability**"
          $md += "- **$totalFiles total files analyzed**"
          $md += ""
          $md += "---"
          $md += ""

          # --- AI ISSUES TABLE ---
          if ($aiCriticalIssues -gt 0) {
            $md += "## 🤖 AI-Detected Critical Issues"
            $md += ""
            $md += "| Category | Severity | Message | Line |"
            $md += "|----------|----------|---------|------|"
            $md += $aiTable.TrimEnd()
            $md += ""
            $md += "---"
            $md += ""
          }

          # --- STATIC SECURITY TABLE ---
          if ($securityIssueCount -gt 0) {
            $md += "## 🛡️ Static Security Issues"
            $md += ""
            $md += "| Type | Severity | Message | Line |"
            $md += "|------|----------|---------|------|"
            $md += $securityTable.TrimEnd()
            $md += ""
            $md += "---"
            $md += ""
          }

          # --- QUALITY GATES ---
          $md += "## 🚦 Quality Gate Status"
          $md += ""
          $md += "| Check | Status |"
          $md += "|--------|--------|"

          if ($aiCriticalIssues -gt 0) { $md += "| AI Review | 🔴 FAIL |" }
          else                         { $md += "| AI Review | 🟢 PASS |" }

          if ($securityIssueCount -gt 0) { $md += "| Security | 🔴 FAIL |" }
          else                           { $md += "| Security | 🟢 PASS |" }

          if ($complexityFails -gt 0)    { $md += "| Complexity | 🔴 FAIL |" }
          else                           { $md += "| Complexity | 🟢 PASS |" }

          if ($maintFails -gt 0)         { $md += "| Maintainability | 🔴 FAIL |" }
          else                           { $md += "| Maintainability | 🟢 PASS |" }

          $md += ""

          $md | Out-File -Encoding utf8 feedback.md


      - name: Post AI Feedback as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'feedback.md';

            if (!fs.existsSync(path)) {
              core.warning('feedback.md not found.');
              return;
            }

            const body = fs.readFileSync(path, 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' &&
                   c.body.includes('AI Code Review Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
